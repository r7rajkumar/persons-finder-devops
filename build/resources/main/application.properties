spring.application.name=persons-finder

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.port=8080

# --- External LLM integration ---
# Injected at runtime via a K8s Secret (see k8s/secret.yaml) — never hardcoded, never baked into the image.
openai.api.key=${OPENAI_API_KEY:}

# --- Actuator: used by the Kubernetes liveness/readiness probes (see k8s/deployment.yaml) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
