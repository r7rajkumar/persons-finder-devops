apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: persons-finder
  namespace: persons-finder
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For production: replace persons-finder.local with your actual domain
    # and provision a real TLS certificate (cert-manager + Let's Encrypt recommended)
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - persons-finder.local
      secretName: persons-finder-tls
  rules:
    - host: persons-finder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: persons-finder
                port:
                  number: 80
