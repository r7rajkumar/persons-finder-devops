# --------------------------------------------------------------------------
# This file is a TEMPLATE, not a real secret — it must never be committed
# with a real value in `stringData`, and in a real cluster it should not be
# a plain K8s Secret at all (see the note at the bottom).
#
# For local dev / a quick minikube demo, create it imperatively so the value
# never touches git or shell history in a file:
#
#   kubectl create secret generic persons-finder-secrets \
#     --namespace persons-finder \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
#
# The manifest below documents the shape of that secret for reference only.
# --------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: persons-finder-secrets
  namespace: persons-finder
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME_DO_NOT_COMMIT_A_REAL_VALUE"

# Production alternative: don't store the value in Kubernetes Secrets at all
# (they're only base64-encoded at rest unless you've enabled encryption-at-rest
# + etcd encryption). Instead use:
#   - AWS: External Secrets Operator + AWS Secrets Manager, syncing into a
#     K8s Secret at deploy time via a SecretStore/ExternalSecret CR, or
#   - HashiCorp Vault + the Vault Agent Injector sidecar, which mounts the
#     key into the pod's filesystem/env without it ever living in etcd.
# The Deployment below reads the key the same way either way (env var from
# a Secret), so swapping the source doesn't require any app changes.
